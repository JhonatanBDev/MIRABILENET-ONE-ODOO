# Bloque para el nginx del sistema anterior (deploy/nginx de mirabilenet-one), que ya tiene el
# certificado. Se agrega el día del cambio, con confirmación. Odoo está en la red como «odoo».
limit_req_zone $binary_remote_addr zone=formularios:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ingreso:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=300r/m;

upstream odoo_http { server odoo:8000; }
upstream odoo_ws { server odoo:8072; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    server_name mirabilenet.com www.mirabilenet.com;   # ajustar al dominio real
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    client_max_body_size 100m;                         # adjuntos de pasantías: hasta 90 MB
    proxy_read_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /websocket {
        proxy_pass http://odoo_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    # Formularios públicos: consulta, inscripción a cursos y alta en la tienda.
    location ~ ^/(contacto|event/.+/registration|shop/address) {
        limit_req zone=formularios burst=5 nodelay;
        proxy_pass http://odoo_http;
    }
    location /web/login {
        limit_req zone=ingreso burst=10 nodelay;
        proxy_pass http://odoo_http;
    }
    # Meta envía ráfagas de estados de mensajes.
    location /api/v1/messaging/whatsapp/webhook {
        limit_req zone=webhook burst=100 nodelay;
        proxy_pass http://odoo_http;
    }
    # La API de n8n va por la red interna, no por internet.
    location /api/v1/messaging/n8n/ { return 404; }
    location / { proxy_pass http://odoo_http; }
}
